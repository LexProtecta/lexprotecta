<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЛексПротекта</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f8ff;--card:#fff;--tx:#13294b;--mut:#667794;--bd:#e3eaf6;--ac:#2b6fe0;--acs:#eaf2ff;
--hi:#fde8e8;--hit:#c62828;--mid:#fff3d6;--midt:#a86a00;--lo:#e1f6e6;--lot:#237a3b}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.app{display:flex;min-height:100vh}
aside{width:236px;flex:none;background:#fff;border-right:1px solid var(--bd);padding:16px 12px;display:flex;flex-direction:column;gap:3px}
.logo{text-align:center;margin-bottom:10px}.logo img{width:170px;max-width:100%;border-radius:14px}
aside a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;color:#3a4d73;cursor:pointer;font-size:15px}
aside a:hover{background:var(--acs)}aside a.on{background:var(--ac);color:#fff}
aside hr{border:0;border-top:1px solid var(--bd);width:100%;margin:8px 0}
main{flex:1;min-width:0;padding:0 26px 34px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0;gap:10px}
.top b{font-size:18px}.ws{border:1px solid var(--bd);background:#fff;padding:6px 14px;border-radius:10px;font-size:13px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:0 6px 22px rgba(43,111,224,.07)}
.hero{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.hero .l{flex:1;min-width:290px;background:linear-gradient(120deg,#fff,#e6f1ff);border:1px solid var(--bd);border-radius:20px;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero h1{margin:0 0 8px;font-size:34px;line-height:1.1}.hero p{margin:0 0 16px;color:var(--mut);max-width:380px}
.hero img{flex:none}
.cur{width:300px;flex:none}.cur h3{margin:4px 0 8px;font-size:18px}
.stats{display:flex;justify-content:space-between;border-top:1px solid var(--bd);margin-top:12px;padding-top:12px}
.stats b{font-size:26px;display:block}.stats span{font-size:12px;color:var(--mut)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:11px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.sec{background:var(--acs);color:var(--ac)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.ok{background:var(--lo);color:var(--lot)}.pr{background:var(--acs);color:var(--ac)}.dr{background:var(--bd);color:var(--mut)}
.hiB{background:var(--hi);color:var(--hit)}.miB{background:var(--mid);color:var(--midt)}.loB{background:var(--lo);color:var(--lot)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.step{background:var(--acs);border-radius:13px;padding:14px}.step b{display:block;margin-bottom:4px}.step span{font-size:13px;color:var(--mut)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:18px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--bd);font-size:14px}
.row:first-of-type{border-top:0}.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--mut)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa div{border:1px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;font-size:14px}.qa div:hover{background:var(--acs)}.qa small{display:block;color:var(--mut)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.tags span{background:var(--acs);color:var(--ac);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600}
h2{margin:0 0 6px;font-size:30px}.sub{color:var(--mut);margin:0 0 18px}
.drop{border:2px dashed #7fb0f0;border-radius:18px;text-align:center;padding:30px 16px;background:#fff;transition:.15s}
.drop.over{background:var(--acs);border-color:var(--ac)}.drop h3{margin:8px 0 2px;font-size:20px}.drop p{margin:2px 0 14px;color:var(--mut)}.drop small{display:block;margin-top:10px;color:var(--mut);font-size:12px}
.ext{display:inline-block;min-width:38px;text-align:center;font-size:10px;font-weight:700;color:#fff;border-radius:5px;padding:3px 4px;background:#e44}
.ext.docx,.ext.doc{background:#2b6fd6}.ext.xlsx,.ext.xls,.ext.csv{background:#2e9b55}.ext.pptx{background:#e07a1f}.ext.zip{background:#7a58c9}.ext.txt,.ext.md,.ext.json{background:#6b7a99}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:20px}
.cats{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.cats label{border:1px solid var(--bd);border-radius:10px;padding:9px 14px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
.gridU{display:grid;grid-template-columns:2fr 1fr;gap:18px}
@media(max-width:900px){.gridU{grid-template-columns:1fr}.cur{width:100%}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;color:var(--tx)}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}.sum b{font-size:30px;display:block}.sum span{font-size:13px;color:var(--mut)}
.verd{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.verd h2{font-size:26px}.verd p{margin:0;color:var(--mut);max-width:560px;line-height:1.5}
.tbar{display:flex;gap:10px;flex-wrap:wrap}
input.s{flex:1;min-width:200px;padding:12px 14px;border-radius:11px;border:1px solid var(--bd);background:#fff;color:var(--tx);font-size:15px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;font-size:13px;color:var(--mut);padding:10px;background:var(--acs)}
td{padding:12px 10px;border-top:1px solid var(--bd);font-size:14px;vertical-align:top}td small{display:block;color:var(--mut);margin-top:3px}
td i{display:block;margin-top:5px;font-size:12px;color:var(--mut);border-left:3px solid #b9d3fa;padding-left:7px}
.st{cursor:pointer;border:0}
.ov{position:fixed;inset:0;background:rgba(19,41,75,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}.ov.on{display:flex}
.box{background:#fff;border-radius:20px;padding:24px;width:min(520px,100%);max-height:88vh;overflow:auto}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:14px 0 10px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fa3f5,var(--ac))}
.log div{font-size:14px;padding:3px 0;color:var(--mut)}.log .d{color:var(--lot)}
textarea{width:100%;height:260px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:10px;font:13px/1.5 monospace}
.empty{text-align:center;padding:36px 10px;color:var(--mut)}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}
@media(max-width:760px){.app{flex-direction:column}aside{width:100%;flex-direction:row;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--bd)}.logo,aside hr{display:none}aside a{white-space:nowrap}main{padding:0 14px 24px}.hero h1{font-size:26px}.hero img{display:none}.qa{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><aside id="nav"></aside><main><div class="top"><b>Добро пожаловать в ЛексПротекта</b><span class="ws">Рабочее пространство: Основное</span></div><div id="view"></div></main></div>
<div class="ov" id="prog"><div class="box" style="text-align:center"><div id="po" class="bob" style="width:130px;margin:0 auto"></div><h3 style="margin:8px 0 4px">Совенок изучает ваш проект</h3><div class="bar"><i id="pb"></i></div><div class="log" id="pl" style="text-align:left"></div></div></div>
<div class="ov" id="chk"><div class="box"><h3 style="margin:0 0 10px">Чек-лист правок</h3><textarea id="ct" readonly></textarea><p style="margin:10px 0 0;text-align:right"><button class="btn sec" id="cp">Копировать</button> <button class="btn" id="cc">Закрыть</button></p></div></div>

 var c=cnt(),Lr=res.risks.filter(function(x){return(filt=='h'||filt=='m'||filt=='l')?x.s==filt:(filt=='all'||x.tag==filt)}).filter(function(x){return!q||(x.t+x.d+x.n+x.r+(x.ev?x.ev.f+x.ev.s:'')).toLowerCase().indexOf(q)>-1});
 function ch(k,t,n){return'<button class="chip '+(filt==k?'on':'')+'" data-f="'+k+'">'+t+(n!=null?' '+n:'')+'</button>'}
 var tg=[];res.risks.forEach(function(x){if(tg.indexOf(x.tag)<0)tg.push(x.tag)});

 +'<div class="sum"><div class="card"><b>'+c.all+'</b><span>Всего рисков</span></div><div class="card"><b style="color:var(--hit)">'+c.h+'</b><span>Высокие: приоритетно</span></div><div class="card"><b style="color:var(--midt)">'+c.m+'</b><span>Средние: рекомендуется устранить</span></div><div class="card"><b style="color:var(--lot)">'+c.l+'</b><span>Низкие: не критичны</span></div></div>'
 +'<div class="tbar"><input class="s" placeholder="Найти риск, норму, документ или требование" value="'+esc(q)+'"><button class="btn sec" id="dl">⇩ Скачать чек-лист</button></div>'

function render(ns){nav();var c=cur(),v=document.getElementById('view');

function bind(){var d=document.getElementById('dz'),fi=document.getElementById('fi');

 document.getElementById('po').innerHTML=owl('ok',130);o.classList.add('on');b.style.width='0';lg.innerHTML='';
 (function step(){if(k>=ST2.length){b.style.width='100%';return setTimeout(fin,500)}
  lg.innerHTML+='<div id="s'+k+'">⏳ '+ST2[k]+'…</div>';var t0=T[k],st=Date.now(),iv=setInterval(function(){b.style.width=Math.min(100,(el+Math.min(t0,Date.now()-st))/tot*100)+'%'},100);
  setTimeout(function(){clearInterval(iv);var e=document.getElementById('s'+k);e.className='d';e.textContent='✓ '+ST2[k];el+=t0;k++;step()},t0)})();
 function fin(){o.classList.remove('on');res=out;filt='all';q='';var d=new Date(),p=function(x){return(x<10?'0':'')+x},m=mood(out),c=cnt(),nm=files[0].name.replace(/\.[^.]+$/,'');
  hist.unshift({name:out.project?'Проект «'+nm+'»':'Файл «'+nm+'»',time:'Сегодня, '+p(d.getHours())+':'+p(d.getMinutes()),m:m,all:c.all,h:c.h,docs:files.length,label:!out.project?'Нет материалов':c.all?'Рисков: '+c.all:'Рисков нет'});go('results');render()}}
